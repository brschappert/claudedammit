<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claudedammit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: min(320px, 80vw);
      height: auto;
      filter: drop-shadow(0 0 40px rgba(255, 220, 0, 0.3));
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.05em;
      color: #f5d800;
      text-transform: lowercase;
    }

    h1 span {
      color: #ff4444;
    }

    .tagline {
      margin-top: 1rem;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: #888;
      max-width: 480px;
      line-height: 1.6;
    }

    .badge {
      margin-top: 2rem;
      display: inline-block;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img src="ClaudeLemon.png" alt="claudedammit mascot" class="logo" />
  <h1>claude<span>dammit</span></h1>
  <p class="tagline">AI-powered apps and demos — because the machines are powerful, and someone should make them weird.</p>
  <div class="badge">coming soon</div>
</body>
</html>
